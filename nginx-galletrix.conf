# ==========================================================
# Galletrix Nginx Configuration: HTTP -> HTTPS Redirection
# File location on VPS: /etc/nginx/sites-available/galletrix
# ==========================================================

# 1. Redirect all HTTP (port 80) traffic to HTTPS (port 443)
server {
    listen 80;
    listen [::]:80;
    server_name galletrix.com www.galletrix.com;

    # 301 Permanent Redirect to HTTPS
    return 301 https://www.galletrix.com$request_uri;
}

